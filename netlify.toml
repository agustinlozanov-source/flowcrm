[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"
  # La credencial de Firebase viaja ahora dentro del paquete de las funciones
  # y no como variable de entorno: Lambda solo admite 4 KB de variables para
  # todas las funciones juntas, y esta clave se comia casi la mitad. El
  # rastreador de secretos la encontraria en el paquete y tumbaria el
  # despliegue, asi que se le dice que esa ya esta puesta a proposito.
  SECRETS_SCAN_OMIT_KEYS = "FIREBASE_PRIVATE_KEY,FIREBASE_CLIENT_EMAIL"

[functions]
  node_bundler = "esbuild"

[functions."get-org-analytics"]
  timeout = 26

# El agente carga su configuracion, el conocimiento, el catalogo y la agenda,
# y despues conversa con el modelo encadenando hasta seis pasos de
# herramientas. Diez segundos no alcanzan, y al cortarse Netlify devuelve un
# 502 con HTML: el navegador intenta leerlo como datos, falla, y en pantalla
# sale "error al conectar" sin mas pistas.
[functions."agent-manager"]
  timeout = 26

[functions."instagram-sync"]
  timeout = 26

# Mide el consumo de todas las organizaciones y dispara las alertas de cupo.
# Antes esto solo pasaba al abrir una organizacion en el panel, asi que una
# cuenta podia pasarse del limite durante semanas sin que nadie se enterara.
# A las 9 UTC: 3 de la manana en Mexico, con el dia anterior ya cerrado.
[functions."medir-consumo"]
  schedule = "0 9 * * *"
  timeout = 26

# Cobra los leads que se pasaron del plan del mes que acaba de cerrar. El dia
# 2 y no el 1: le da al medidor diario una corrida completa sobre el mes ya
# cerrado antes de convertirlo en dinero.
[functions."cobrar-excedente"]
  schedule = "0 10 2 * *"
  timeout = 26

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
